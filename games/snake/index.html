<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>змейка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f5f0e8;
    --text:    #222;
    --muted:   #6b6459;
    --rule:    #d9d1c2;
    --accent:  #8a3a1e;
    --figbg:   #ece5d7;
    --canvas-bg: #e8e2d8;
    --food:    #7a5500;
    --snake-head: #6a2a10;
  }
  html[data-theme="dark"] {
    --bg:      #1a1a1a;
    --text:    #e0d8cc;
    --muted:   #8a8378;
    --rule:    #33302b;
    --accent:  #d68a6a;
    --figbg:   #232220;
    --canvas-bg: #111009;
    --food:    #d4b86a;
    --snake-head: #f0a07a;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) {
      --bg: #1a1a1a; --text: #e0d8cc; --muted: #8a8378;
      --rule: #33302b; --accent: #d68a6a; --figbg: #232220;
      --canvas-bg: #111009; --food: #d4b86a; --snake-head: #f0a07a;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); height: 100%; }
  body {
    font-family: "Inter", -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 20px;
    gap: 0;
  }

  /* ── top bar ── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
  }
  .home-link {
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
    transition: color .15s;
  }
  .home-link:hover { color: var(--accent); }
  .theme-toggle {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 5px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

  /* ── score ── */
  .score-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 16px;
    width: min(400px, calc(100vw - 48px));
  }
  .score-label {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .score-value {
    font-family: "Fraunces", Georgia, serif;
    font-size: 28px;
    color: var(--text);
    line-height: 1;
    min-width: 2ch;
  }
  .best-value {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
  }

  /* ── canvas wrapper ── */
  .canvas-wrap {
    position: relative;
    width: min(400px, calc(100vw - 48px));
    height: min(400px, calc(100vw - 48px));
    border-radius: 6px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 6px;
  }

  /* ── overlay (start / game over) ── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    border-radius: 6px;
    backdrop-filter: blur(2px);
    transition: opacity .2s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-title {
    font-family: "Fraunces", Georgia, serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -.01em;
  }
  .overlay-sub {
    font-size: 14px;
    color: var(--muted);
  }
  .play-btn {
    margin-top: 8px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    padding: 10px 28px;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s;
  }
  .play-btn:hover { opacity: .85; }

  /* ── controls ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    width: min(400px, calc(100vw - 48px));
    flex-wrap: wrap;
  }
  .walls-btn {
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 6px 14px;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .walls-btn:hover { color: var(--text); border-color: var(--text); }
  .walls-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .15s;
    flex-shrink: 0;
  }
  .walls-btn.walls-on .walls-dot { background: var(--accent); }
  .walls-btn.walls-on { color: var(--text); border-color: var(--rule); }

  .pause-btn {
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 6px 14px;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .pause-btn:hover { color: var(--text); border-color: var(--text); }
  .pause-btn.active { color: var(--accent); border-color: var(--accent); }
  .pause-btn:disabled { opacity: 0.35; cursor: default; }

  /* speed slider */
  .speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(400px, calc(100vw - 48px));
    margin-top: 10px;
  }
  .speed-label {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }
  .speed-end { font-size: 14px; flex-shrink: 0; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--rule);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform .1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    cursor: pointer;
  }
  input[type=range]::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: var(--rule);
  }

  .hint {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }

  /* ── mobile arrows ── */
  .dpad {
    display: none;
    margin-top: 20px;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(2, 48px);
    gap: 6px;
  }
  .dpad-btn {
    background: var(--figbg);
    border: 1px solid var(--rule);
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .dpad-btn:active { background: var(--rule); }
  .dpad-up    { grid-column: 2; grid-row: 1; }
  .dpad-left  { grid-column: 1; grid-row: 2; }
  .dpad-down  { grid-column: 2; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }

  @media (pointer: coarse) {
    .dpad { display: grid; }
    .hint { display: none; }
  }

  @media (max-width: 480px) {
    body { padding: 12px; gap: 0; justify-content: flex-start; padding-top: 72px; }
    .score-row, .controls, .speed-row { max-width: 100%; }
    .controls { flex-wrap: wrap; gap: 8px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="home-link" href="/">← salmpac.ru</a>
  <button class="theme-toggle" id="themeToggle">☾ тёмная</button>
</div>

<div class="score-row">
  <span class="score-label">счёт</span>
  <span class="score-value" id="scoreVal">0</span>
  <span class="best-value" id="bestVal">рекорд: 0</span>
</div>

<div class="canvas-wrap">
  <canvas id="canvas" width="400" height="400"></canvas>

  <div class="overlay" id="overlay">
    <div class="overlay-title" id="overlayTitle">змейка</div>
    <div class="overlay-sub" id="overlaySub">стрелки или wasd для управления</div>
    <button class="play-btn" id="playBtn">играть</button>
  </div>
</div>

<div class="controls">
  <button class="walls-btn" id="wallsBtn">
    <span class="walls-dot"></span>
    <span id="wallsLabel">граница: нет</span>
  </button>
  <button class="pause-btn" id="pauseBtn" disabled>пауза</button>
  <span class="hint">пробел / p</span>
</div>

<div class="speed-row">
  <span class="speed-label">скорость</span>
  <span class="speed-end">🐢</span>
  <input type="range" id="speedSlider" min="1" max="20" value="14">
  <span class="speed-end">⚡</span>
</div>

<div class="dpad">
  <button class="dpad-btn dpad-up"    data-dir="UP">↑</button>
  <button class="dpad-btn dpad-left"  data-dir="LEFT">←</button>
  <button class="dpad-btn dpad-down"  data-dir="DOWN">↓</button>
  <button class="dpad-btn dpad-right" data-dir="RIGHT">→</button>
</div>

<script>
const COLS = 20, ROWS = 20;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// canvas logical size — always 400x400 regardless of CSS scaling
const W = 400, H = 400;
canvas.width = W; canvas.height = H;
const CELL = W / COLS;

// ── state ──
let snake, dir, nextDir, food, score, best, walls, running, paused, boosted, animId, lastTime, interval, speedBase;
walls = false;
paused = false;
speedBase = 140;
best = +localStorage.getItem('snake_best') || 0;
document.getElementById('bestVal').textContent = 'рекорд: ' + best;

// ── colors from CSS vars ──
function c(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// ── init ──
function init() {
  snake = [
    {x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}
  ];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  paused = false;
  boosted = false;
  interval = speedBase;
  lastTime = 0;
  spawnFood();
  updateScore();
}

function spawnFood() {
  const empty = [];
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      if (!snake.some(s => s.x === x && s.y === y))
        empty.push({x, y});
  food = empty[Math.floor(Math.random() * empty.length)];
}

// ── game loop ──
function loop(ts) {
  animId = requestAnimationFrame(loop);
  if (paused) return;
  const eff = boosted ? Math.max(40, Math.floor(interval / 2.5)) : interval;
  if (ts - lastTime < eff) { draw(); return; }
  lastTime = ts;
  step();
  draw();
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (walls) {
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { die(); return; }
  } else {
    head.x = (head.x + COLS) % COLS;
    head.y = (head.y + ROWS) % ROWS;
  }

  if (snake.some(s => s.x === head.x && s.y === head.y)) { die(); return; }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    interval = Math.max(Math.floor(speedBase * 0.4), speedBase - score * Math.floor(speedBase / 50));
    updateScore();
    spawnFood();
  } else {
    snake.pop();
  }
}

function die() {
  running = false;
  paused = false;
  cancelAnimationFrame(animId);
  document.getElementById('pauseBtn').disabled = true;
  document.getElementById('pauseBtn').classList.remove('active');
  document.getElementById('pauseBtn').textContent = 'пауза';
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best', best);
    document.getElementById('bestVal').textContent = 'рекорд: ' + best;
  }
  const overlay = document.getElementById('overlay');
  document.getElementById('overlayTitle').textContent = 'игра окончена';
  document.getElementById('overlaySub').textContent = 'счёт: ' + score;
  document.getElementById('playBtn').textContent = 'ещё раз';
  overlay.classList.remove('hidden');
  // one last draw with dead snake
  draw(true);
}

// ── draw ──
function draw(dead) {
  const bg      = c('--canvas-bg');
  const accent  = c('--accent');
  const headClr = c('--snake-head');
  const foodClr = c('--food');
  const ruleClr = c('--rule');
  const muted   = c('--muted');

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // wall border
  if (walls) {
    ctx.strokeStyle = c('--accent');
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
  }

  // food — rounded square
  const f = food;
  const fp = CELL * 0.2;
  ctx.fillStyle = foodClr;
  roundRect(ctx, f.x * CELL + fp, f.y * CELL + fp, CELL - fp * 2, CELL - fp * 2, 3);
  ctx.fill();

  // snake
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    // interpolate accent → muted for tail
    ctx.fillStyle = i === 0 ? headClr : accent;
    ctx.globalAlpha = dead ? 0.4 : (i === 0 ? 1 : 0.75 + 0.25 * (1 - t));
    const pad = i === 0 ? CELL * 0.06 : CELL * 0.12;
    roundRect(ctx, seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function updateScore() {
  document.getElementById('scoreVal').textContent = score;
}

// ── start ──
function startGame() {
  init();
  document.getElementById('overlay').classList.add('hidden');
  running = true;
  paused = false;
  document.getElementById('pauseBtn').disabled = false;
  document.getElementById('pauseBtn').classList.remove('active');
  document.getElementById('pauseBtn').textContent = 'пауза';
  animId = requestAnimationFrame(loop);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  const btn = document.getElementById('pauseBtn');
  btn.classList.toggle('active', paused);
  btn.textContent = paused ? 'продолжить' : 'пауза';
  if (paused) {
    // draw pause overlay on canvas
    ctx.fillStyle = 'color-mix(in srgb, ' + c('--bg') + ' 70%, transparent)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = c('--text');
    ctx.font = '600 28px Fraunces, Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('пауза', W / 2, H / 2);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }
}

document.getElementById('playBtn').addEventListener('click', startGame);

// ── pause ──
document.getElementById('pauseBtn').addEventListener('click', togglePause);

// ── speed slider ──
function sliderToBase(val) {
  // val 1..20 → interval 500..60ms (higher = faster)
  return Math.round(500 - (val - 1) * (500 - 60) / 19);
}
document.getElementById('speedSlider').addEventListener('input', function() {
  speedBase = sliderToBase(+this.value);
  if (running && !paused) {
    interval = Math.max(Math.floor(speedBase * 0.4), speedBase - score * Math.floor(speedBase / 50));
  }
});

// ── walls toggle ──
const wallsBtn = document.getElementById('wallsBtn');
wallsBtn.addEventListener('click', () => {
  walls = !walls;
  wallsBtn.classList.toggle('walls-on', walls);
  document.getElementById('wallsLabel').textContent = walls ? 'граница: есть' : 'граница: нет';
});

// ── keyboard ──
const KEY_MAP = {
  ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT',
  w: 'UP', s: 'DOWN', a: 'LEFT', d: 'RIGHT',
  W: 'UP', S: 'DOWN', A: 'LEFT', D: 'RIGHT',
};
const DIR_MAP = {
  UP:    {x: 0,  y: -1},
  DOWN:  {x: 0,  y:  1},
  LEFT:  {x: -1, y:  0},
  RIGHT: {x: 1,  y:  0},
};

const DIR_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','s','a','d','W','S','A','D']);

let boostTimer = null;
function armBoost() {
  if (boostTimer !== null) return;
  boostTimer = setTimeout(() => { boosted = true; }, 150);
}
function disarmBoost() {
  if (boostTimer !== null) { clearTimeout(boostTimer); boostTimer = null; }
  boosted = false;
}

document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    if (running) togglePause();
    return;
  }
  const d = KEY_MAP[e.key];
  if (!d) return;
  e.preventDefault();
  if (DIR_KEYS.has(e.key) && !e.repeat) armBoost();
  if (!running) { startGame(); return; }
  if (paused) { togglePause(); }
  const nd = DIR_MAP[d];
  if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
});

document.addEventListener('keyup', e => {
  if (DIR_KEYS.has(e.key)) disarmBoost();
});

// ── d-pad ──
document.querySelectorAll('.dpad-btn').forEach(btn => {
  function pressDir() {
    const d = btn.dataset.dir;
    if (!running) { startGame(); return; }
    const nd = DIR_MAP[d];
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  }
  btn.addEventListener('click', pressDir);
  btn.addEventListener('mousedown', () => { armBoost(); });
  btn.addEventListener('touchstart', () => { pressDir(); armBoost(); }, {passive: true});
});

document.addEventListener('mouseup', () => { disarmBoost(); });
document.addEventListener('touchend', () => { disarmBoost(); });

// ── touch swipe + double tap ──
let touchStart = null;
let lastTap = 0;

document.addEventListener('touchstart', e => {
  // не трогаем кнопки и инпуты — пусть работают нормально
  if (e.target.closest('button, input, a')) return;
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  if (running) e.preventDefault();
}, {passive: false});

document.addEventListener('touchend', e => {
  if (e.target.closest('button, input, a')) return;
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  touchStart = null;

  // double tap
  if (dist < 12) {
    const now = Date.now();
    if (now - lastTap < 300) {
      if (running) togglePause();
      lastTap = 0;
    } else {
      lastTap = now;
    }
    return;
  }

  // swipe
  if (dist < 20) return;
  let d;
  if (Math.abs(dx) > Math.abs(dy)) d = dx > 0 ? 'RIGHT' : 'LEFT';
  else d = dy > 0 ? 'DOWN' : 'UP';

  if (!running) { startGame(); return; }
  if (paused) togglePause();
  const nd = DIR_MAP[d];
  if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
}, {passive: false});

// ── theme toggle ──
(function () {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme');
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  function current() {
    const a = root.getAttribute('data-theme');
    return a || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function render() { btn.textContent = current() === 'dark' ? '☀ светлая' : '☾ тёмная'; }
  btn.addEventListener('click', () => {
    const next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    render();
  });
  render();
})();

// initial draw
init();
draw();
</script>
</body>
</html>
