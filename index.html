<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сергей Душенков</title>
<meta name="description" content="Пишу о себе и обо всём, что мне интересно.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --text: #222;
    --muted: #6b6459;
    --rule: #d9d1c2;
    --accent: #8a3a1e;
  }
  html[data-theme="dark"] {
    --bg: #1a1a1a;
    --text: #e0d8cc;
    --muted: #8a8378;
    --rule: #33302b;
    --accent: #d68a6a;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) {
      --bg: #1a1a1a;
      --text: #e0d8cc;
      --muted: #8a8378;
      --rule: #33302b;
      --accent: #d68a6a;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 96px 24px 120px;
  }

  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 44px;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text);
  }

  .intro {
    font-size: 22px;
    margin: 0 0 72px;
    line-height: 1.5;
  }

  /* Sections */
  .section {
    margin-bottom: 48px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .post-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .post-list li {
    padding: 4px 0;
  }

  .post-list a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    font-size: 17px;
    transition: border-color 0.15s ease;
  }

  .post-list a:hover {
    border-color: var(--accent);
    opacity: 1;
  }

  /* Contact */
  .contact {
    margin-top: 72px;
  }

  .contact-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
  }

  .contact a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    font-size: 17px;
  }
  .contact a:hover { opacity: 0.75; }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 24px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 520px) {
    body { font-size: 17px; }
    main { padding: 64px 20px 96px; }
    h1 { font-size: 36px; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">☾ тёмная</button>

<main>
  <p class="intro">Меня зовут Сергей Душенков, и здесь я пишу о себе и обо всём, что мне интересно.</p>

  <div class="section">
    <p class="section-label">Хроники</p>
    <ul class="post-list">
      <li><a href="/posts/3_semestr/">Пост про III семестр</a></li>
      <li><a href="/posts/4_semestr/">Пост про IV семестр</a></li>
    </ul>
  </div>

  <div class="section">
    <p class="section-label">Программирование</p>
    <ul class="post-list">
      <li><a href="/posts/cxa_guard/">__cxa_guard</a></li>
    </ul>
  </div>

  <div class="section">
    <p class="section-label">Поиграть</p>
    <ul class="post-list">
      <li><a href="/games/snake/">змейка</a></li>
    </ul>
  </div>

  <div class="contact">
    <p class="contact-label">Связаться со мной</p>
    <a href="https://t.me/salmpac">@salmpac</a>
  </div>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
    function currentTheme() {
      var attr = root.getAttribute('data-theme');
      if (attr) return attr;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function render() {
      btn.textContent = currentTheme() === 'dark' ? '☀ светлая' : '☾ тёмная';
    }
    btn.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      render();
    });
    render();
  })();
</script>
</body>
</html>
